name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp pytest pytest-asyncio ruff
      - run: python -m pytest tests_client -q
      - run: python -m ruff check custom_components tests_client tools
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'homeassistant==2026.10.4' 'pytest-homeassistant-custom-component==0.13.375'
      - run: python -m pytest tests -q
